name: Build Universal Device Agent from Uploaded ZIP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded source ZIP
        run: unzip -oq Universal_Device_Agent_Railway_Connected.zip -d .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Verify source
        run: |
          test -f shared_app/pubspec.yaml
          test -f shared_app/lib/main.dart
      - name: Generate Android platform files
        working-directory: shared_app
        run: |
          flutter create --platforms=android --org com.deviceagent --project-name shared_app .
          # Retain the modern Kotlin DSL files generated by Flutter.
          # Remove legacy Groovy files shipped in the source archive.
          rm -f android/settings.gradle android/build.gradle android/app/build.gradle
          rm -rf android/app/src/main/kotlin/com/example
      - name: Patch Android manifest and DocumentFile dependency
        working-directory: shared_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text(encoding="utf-8")
          patched = re.sub(r'\s+package="[^"]+"', "", source, count=1)
          if patched == source and 'package="' in source:
              raise SystemExit("Could not remove legacy manifest package attribute")
          manifest.write_text(patched, encoding="utf-8")
          gradle = Path("android/app/build.gradle.kts")
          build = gradle.read_text(encoding="utf-8")
          dependency = 'implementation("androidx.documentfile:documentfile:1.1.0")'
          if dependency not in build:
              build += "\n\ndependencies {\n    " + dependency + "\n}\n"
              gradle.write_text(build, encoding="utf-8")
          print("Android manifest package cleaned; DocumentFile dependency ensured.")
          PY
      - name: Set supported Android Gradle wrapper version
        working-directory: shared_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/gradle/wrapper/gradle-wrapper.properties")
          text = p.read_text(encoding="utf-8")
          updated, count = re.subn(
              r"(?m)^distributionUrl=.*$",
              "distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip",
              text,
          )
          if count != 1:
              raise SystemExit(f"Expected one distributionUrl, found {count}")
          p.write_text(updated, encoding="utf-8")
          print(updated)
          PY
      - name: Build APK
        working-directory: shared_app
        env:
          CONTROL_API_URL: ${{ vars.CONTROL_API_URL || 'https://102-production.up.railway.app' }}
        run: |
          flutter pub get
          flutter build apk --release --dart-define=CONTROL_API_URL="$CONTROL_API_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: Universal-Device-Agent-APK
          path: shared_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Windows EXE Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded source ZIP
        shell: pwsh
        run: Expand-Archive -LiteralPath Universal_Device_Agent_Railway_Connected.zip -DestinationPath . -Force
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Verify source
        shell: pwsh
        run: |
          if (!(Test-Path 'shared_app/pubspec.yaml')) { throw 'shared_app/pubspec.yaml not found after ZIP extraction.' }
          if (!(Test-Path 'shared_app/windows/CMakeLists.txt')) { throw 'Custom Windows CMakeLists.txt is missing.' }
      - name: Upgrade secure storage dependency compatibly
        shell: pwsh
        run: |
          @'
          import re
          from pathlib import Path
          p = Path("shared_app/pubspec.yaml")
          text = p.read_text(encoding="utf-8")
          old = "flutter_secure_storage: ^9.2.2"
          new = "flutter_secure_storage: ^11.2.0"
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one {old!r} dependency")
          updated = text.replace(old, new)
          p.write_text(updated, encoding="utf-8")
          print(updated)
          '@ | python -
          Get-Content 'shared_app/pubspec.yaml'
      - name: Generate missing managed Windows CMake files safely
        shell: pwsh
        run: |
          $template = Join-Path $env:RUNNER_TEMP 'uda_windows_template'
          if (Test-Path $template) { Remove-Item $template -Recurse -Force }
          flutter create --platforms=windows --org com.deviceagent --project-name shared_app $template
          $sourceFlutter = Join-Path $template 'windows/flutter'
          $targetFlutter = 'shared_app/windows/flutter'
          if (!(Test-Path (Join-Path $sourceFlutter 'CMakeLists.txt'))) { throw 'Flutter template did not generate windows/flutter/CMakeLists.txt.' }
          if (Test-Path $targetFlutter) { Remove-Item $targetFlutter -Recurse -Force }
          New-Item -ItemType Directory -Force -Path 'shared_app/windows' | Out-Null
          Copy-Item $sourceFlutter $targetFlutter -Recurse -Force
      - name: Suppress deprecated MSVC experimental coroutine diagnostic
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p = Path("shared_app/windows/CMakeLists.txt")
          text = p.read_text(encoding="utf-8")
          macro = "add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)"
          anchor = "add_subdirectory(" + chr(36) + "{FLUTTER_MANAGED_DIR})"
          if macro not in text:
              if anchor not in text:
                  raise SystemExit("Could not find Flutter managed CMake subdirectory anchor.")
              text = text.replace(anchor, macro + "\n" + anchor, 1)
              p.write_text(text, encoding="utf-8")
          print("MSVC STL1011 compatibility definition added.")
          '@ | python -
      - name: Build Windows release
        working-directory: shared_app
        env:
          CONTROL_API_URL: ${{ vars.CONTROL_API_URL || 'https://102-production.up.railway.app' }}
        run: |
          flutter pub get
          if (!(Test-Path 'windows/flutter/CMakeLists.txt')) { throw 'windows/flutter/CMakeLists.txt still missing.' }
          # flutter_secure_storage_windows uses TCHAR together with wide strings.
          # Its Windows plugin target must compile with the Unicode Win32 API.
          $pluginCmake = Join-Path $env:LOCALAPPDATA 'Pub/Cache/hosted/pub.dev/flutter_secure_storage_windows-4.2.2/windows/CMakeLists.txt'
          if (!(Test-Path $pluginCmake)) {
            $pluginCmake = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Pub/Cache/hosted/pub.dev') -Directory -Filter 'flutter_secure_storage_windows-*' |
              ForEach-Object { Join-Path $_.FullName 'windows/CMakeLists.txt' } |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
          }
          if (!$pluginCmake) { throw 'Could not locate flutter_secure_storage_windows CMakeLists.txt in Pub cache.' }
          $cmakeText = Get-Content $pluginCmake -Raw
          if ($cmakeText -notmatch 'target_compile_definitions\(\$\{PLUGIN_NAME\} PRIVATE FLUTTER_PLUGIN_IMPL UNICODE _UNICODE\)') {
            $cmakeText = $cmakeText -replace 'target_compile_definitions\(\$\{PLUGIN_NAME\} PRIVATE FLUTTER_PLUGIN_IMPL\)', 'target_compile_definitions(${PLUGIN_NAME} PRIVATE FLUTTER_PLUGIN_IMPL UNICODE _UNICODE)'
            if ($cmakeText -notmatch 'FLUTTER_PLUGIN_IMPL UNICODE _UNICODE') { throw 'Failed to apply Unicode compile definitions to secure storage plugin.' }
            Set-Content -Path $pluginCmake -Value $cmakeText -NoNewline
          }
          Write-Host "Patched Unicode Win32 definitions in $pluginCmake"
          flutter build windows --release --dart-define=CONTROL_API_URL="$env:CONTROL_API_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: Universal-Device-Agent-Windows
          path: shared_app/build/windows/x64/runner/Release/
          if-no-files-found: error

  windows7_legacy:
    name: Windows 7 x64 Legacy Build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded source ZIP
        shell: pwsh
        run: Expand-Archive -LiteralPath Universal_Device_Agent_Railway_Connected.zip -DestinationPath . -Force
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: stable
          cache: true
      - name: Prepare Windows 7 compatible Dart and Flutter dependencies
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p = Path("shared_app/pubspec.yaml")
          text = p.read_text(encoding="utf-8")
          replacements = {
              'sdk: ">=3.6.0 <4.0.0"': 'sdk: ">=3.3.0 <4.0.0"',
              'flutter: ">=3.27.0"': 'flutter: ">=3.19.0"',
              'flutter_secure_storage: ^9.2.2': 'flutter_secure_storage: 9.2.4',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one {old!r} in pubspec.yaml")
              text = text.replace(old, new)
          anchor = "dev_dependencies:\n"
          if text.count(anchor) != 1:
              raise SystemExit("Could not find dev_dependencies insertion point.")
          text = text.replace(
              anchor,
              "dependency_overrides:\n"
              "  flutter_secure_storage_windows: 3.1.2\n"
              "  win32: 5.5.0\n\n"
              + anchor,
              1,
          )
          p.write_text(text, encoding="utf-8")
          print("Pinned the Windows 7 build to the final Flutter/Dart-compatible dependency line.")
          '@ | python -
          @'
          from pathlib import Path
          p = Path("shared_app/lib/theme/app_theme.dart")
          text = p.read_text(encoding="utf-8")
          if "CardThemeData(" not in text:
              raise SystemExit("CardThemeData constructor not found; refusing an unsafe theme patch.")
          p.write_text(text.replace("CardThemeData(", "CardTheme("), encoding="utf-8")
          print("Patched CardThemeData to the Flutter 3.19 CardTheme API.")
          '@ | python -
          @'
          from pathlib import Path
          p = Path("shared_app/lib/task_monitor/step_timeline.dart")
          text = p.read_text(encoding="utf-8")
          old = ".withValues(alpha: 0.5)"
          if text.count(old) != 1:
              raise SystemExit("Expected the single Flutter 3.27+ Color.withValues call.")
          p.write_text(text.replace(old, ".withOpacity(0.5)"), encoding="utf-8")
          '@ | python -
          @'
          from pathlib import Path
          p = Path("shared_app/windows/runner/runner.exe.manifest")
          p.write_text(
              '''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <application>
              <windowsSettings>
                <dpiAware xmlns="http://schemas.microsoft.com/SMI/2005/WindowsSettings">true</dpiAware>
              </windowsSettings>
            </application>
          </assembly>
          ''',
              encoding="utf-8",
          )
          print("Applied the Windows 7-compatible DPI manifest.")
          '@ | python -
      - name: Generate Flutter 3.19 managed Windows files
        shell: pwsh
        run: |
          $template = Join-Path $env:RUNNER_TEMP 'uda_windows7_template'
          if (Test-Path $template) { Remove-Item $template -Recurse -Force }
          flutter create --platforms=windows --org com.deviceagent --project-name shared_app $template
          $sourceFlutter = Join-Path $template 'windows/flutter'
          $targetFlutter = 'shared_app/windows/flutter'
          if (!(Test-Path (Join-Path $sourceFlutter 'CMakeLists.txt'))) { throw 'Flutter 3.19 did not generate managed Windows CMake files.' }
          if (Test-Path $targetFlutter) { Remove-Item $targetFlutter -Recurse -Force }
          Copy-Item $sourceFlutter $targetFlutter -Recurse -Force
      - name: Resolve dependencies and apply secure-storage Win32 compatibility
        working-directory: shared_app
        shell: pwsh
        run: |
          flutter pub get
          if (!(Test-Path 'tool/ci/prepare_windows.ps1')) { throw 'Windows compatibility patch script missing from source ZIP.' }
          powershell -NoProfile -ExecutionPolicy Bypass -File 'tool/ci/prepare_windows.ps1'
      - name: Build Windows 7 x64 release bundle
        working-directory: shared_app
        env:
          CONTROL_API_URL: ${{ vars.CONTROL_API_URL || 'https://102-production.up.railway.app' }}
        shell: pwsh
        run: |
          flutter build windows --release --dart-define=CONTROL_API_URL="$env:CONTROL_API_URL"
          $bundle = 'build/windows/x64/runner/Release'
          if (!(Test-Path (Join-Path $bundle 'device_agent.exe'))) { throw 'device_agent.exe missing from legacy build.' }
          if (!(Test-Path (Join-Path $bundle 'flutter_windows.dll'))) { throw 'flutter_windows.dll missing from legacy bundle.' }
          if (!(Test-Path (Join-Path $bundle 'data/flutter_assets'))) { throw 'Flutter assets missing from legacy bundle.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Universal-Device-Agent-Windows7-x64-Legacy
          path: shared_app/build/windows/x64/runner/Release/
          if-no-files-found: error

  linux:
    name: Linux / ChromeOS Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded source ZIP
        run: unzip -oq Universal_Device_Agent_Railway_Connected.zip -d .
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libglib2.0-dev libpipewire-0.3-dev libx11-dev libxtst-dev libturbojpeg0-dev libebook1.2-dev dpkg
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing managed Linux CMake files safely
        shell: bash
        run: |
          set -euo pipefail
          test -f shared_app/pubspec.yaml
          template="$RUNNER_TEMP/uda_linux_template"
          rm -rf "$template"
          flutter create --platforms=linux --org com.deviceagent --project-name shared_app "$template"
          test -f "$template/linux/flutter/CMakeLists.txt"
          rm -rf shared_app/linux/flutter
          cp -a "$template/linux/flutter" shared_app/linux/flutter
      - name: Build Linux release
        working-directory: shared_app
        env:
          CONTROL_API_URL: ${{ vars.CONTROL_API_URL || 'https://102-production.up.railway.app' }}
        run: |
          flutter pub get
          test -f linux/flutter/CMakeLists.txt
          flutter build linux --release --dart-define=CONTROL_API_URL="$CONTROL_API_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: Universal-Device-Agent-Linux
          path: shared_app/build/linux/x64/release/bundle/
          if-no-files-found: error
