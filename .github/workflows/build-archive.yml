name: Build Universal Device Agent from Uploaded ZIP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded source ZIP
        run: unzip -oq Universal_Device_Agent_Railway_Connected.zip -d .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Verify source
        run: |
          test -f shared_app/pubspec.yaml
          test -f shared_app/lib/main.dart
      - name: Generate Android platform files
        working-directory: shared_app
        run: |
          flutter create --platforms=android --org com.deviceagent --project-name shared_app .
          # Retain the modern Kotlin DSL files generated by Flutter.
          # Remove legacy Groovy files shipped in the source archive.
          rm -f android/settings.gradle android/build.gradle android/app/build.gradle
          rm -rf android/app/src/main/kotlin/com/example
      - name: Set supported Android Gradle wrapper version
        working-directory: shared_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/gradle/wrapper/gradle-wrapper.properties")
          text = p.read_text(encoding="utf-8")
          updated, count = re.subn(
              r"(?m)^distributionUrl=.*$",
              "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-bin.zip",
              text,
          )
          if count != 1:
              raise SystemExit(f"Expected one distributionUrl, found {count}")
          p.write_text(updated, encoding="utf-8")
          print(updated)
          PY
      - name: Build APK
        working-directory: shared_app
        env:
          CONTROL_API_URL: ${{ vars.CONTROL_API_URL || 'https://102-production.up.railway.app' }}
        run: |
          flutter pub get
          flutter build apk --release --dart-define=CONTROL_API_URL="$CONTROL_API_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: Universal-Device-Agent-APK
          path: shared_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Windows EXE Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded source ZIP
        shell: pwsh
        run: Expand-Archive -LiteralPath Universal_Device_Agent_Railway_Connected.zip -DestinationPath . -Force
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Verify source
        shell: pwsh
        run: |
          if (!(Test-Path 'shared_app/pubspec.yaml')) { throw 'shared_app/pubspec.yaml not found after ZIP extraction.' }
          if (!(Test-Path 'shared_app/windows/CMakeLists.txt')) { throw 'Custom Windows CMakeLists.txt is missing.' }
      - name: Upgrade secure storage dependency compatibly
        shell: pwsh
        run: |
          @'
          import re
          from pathlib import Path
          p = Path("shared_app/pubspec.yaml")
          text = p.read_text(encoding="utf-8")
          old = "flutter_secure_storage: ^9.2.2"
          new = "flutter_secure_storage: ^11.2.0"
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one {old!r} dependency")
          updated = text.replace(old, new)
          p.write_text(updated, encoding="utf-8")
          print(updated)
          '@ | python -
          Get-Content 'shared_app/pubspec.yaml'
      - name: Generate missing managed Windows CMake files safely
        shell: pwsh
        run: |
          $template = Join-Path $env:RUNNER_TEMP 'uda_windows_template'
          if (Test-Path $template) { Remove-Item $template -Recurse -Force }
          flutter create --platforms=windows --org com.deviceagent --project-name shared_app $template
          $sourceFlutter = Join-Path $template 'windows/flutter'
          $targetFlutter = 'shared_app/windows/flutter'
          if (!(Test-Path (Join-Path $sourceFlutter 'CMakeLists.txt'))) { throw 'Flutter template did not generate windows/flutter/CMakeLists.txt.' }
          if (Test-Path $targetFlutter) { Remove-Item $targetFlutter -Recurse -Force }
          New-Item -ItemType Directory -Force -Path 'shared_app/windows' | Out-Null
          Copy-Item $sourceFlutter $targetFlutter -Recurse -Force
      - name: Build Windows release
        working-directory: shared_app
        env:
          CONTROL_API_URL: ${{ vars.CONTROL_API_URL || 'https://102-production.up.railway.app' }}
        run: |
          flutter pub get
          if (!(Test-Path 'windows/flutter/CMakeLists.txt')) { throw 'windows/flutter/CMakeLists.txt still missing.' }
          flutter build windows --release --dart-define=CONTROL_API_URL="$env:CONTROL_API_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: Universal-Device-Agent-Windows
          path: shared_app/build/windows/x64/runner/Release/
          if-no-files-found: error

  linux:
    name: Linux / ChromeOS Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded source ZIP
        run: unzip -oq Universal_Device_Agent_Railway_Connected.zip -d .
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libglib2.0-dev libpipewire-0.3-dev libx11-dev libxtst-dev libturbojpeg0-dev libebook1.2-dev dpkg
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing managed Linux CMake files safely
        shell: bash
        run: |
          set -euo pipefail
          test -f shared_app/pubspec.yaml
          template="$RUNNER_TEMP/uda_linux_template"
          rm -rf "$template"
          flutter create --platforms=linux --org com.deviceagent --project-name shared_app "$template"
          test -f "$template/linux/flutter/CMakeLists.txt"
          rm -rf shared_app/linux/flutter
          cp -a "$template/linux/flutter" shared_app/linux/flutter
      - name: Build Linux release
        working-directory: shared_app
        env:
          CONTROL_API_URL: ${{ vars.CONTROL_API_URL || 'https://102-production.up.railway.app' }}
        run: |
          flutter pub get
          test -f linux/flutter/CMakeLists.txt
          flutter build linux --release --dart-define=CONTROL_API_URL="$CONTROL_API_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: Universal-Device-Agent-Linux
          path: shared_app/build/linux/x64/release/bundle/
          if-no-files-found: error
